<!DOCTYPE html>
<html>

<head>

<title>AI Smart Campus Login</title>

<link rel="stylesheet" href="/static/style.css">

<style>

.login-container{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-card{
background:white;
color:black;
padding:40px;
border-radius:10px;
width:300px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.login-card input{
width:90%;
padding:10px;
margin:10px 0;
border-radius:5px;
border:1px solid #ccc;
}

.login-card button{
width:100%;
padding:10px;
background:#1f4037;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.login-card button:hover{
background:black;
}

</style>

</head>

<body>

<div class="login-container">

<div class="login-card">

<h2>AI Smart Campus</h2>

<form action="/login" method="POST">

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

</div>

</div>

</body>

</html>
