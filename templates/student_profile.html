
<!DOCTYPE html>
<html>
<head>
<title>Student Profile</title>

<style>
body{
    margin:0;
    font-family:Segoe UI;
    background:linear-gradient(135deg,#1f4037,#99f2c8);
    color:white;
}

.header{
    text-align:center;
    padding:30px;
    font-size:30px;
    font-weight:bold;
}

.card{
    width:40%;
    margin:auto;
    padding:30px;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
}

.item{
    margin:15px 0;
    font-size:18px;
}

.btn{
    padding:10px 20px;
    border:none;
    border-radius:5px;
    background:#1f4037;
    color:white;
    cursor:pointer;
}

.edit-form{
    display:none;
    margin-top:20px;
}

input{
    width:100%;
    padding:8px;
    margin:5px 0;
}
</style>

<script>
function toggleEdit(){
    let form = document.getElementById("editForm");

    if(form.style.display=="block")
        form.style.display="none";
    else
        form.style.display="block";
}
</script>

</head>

<body>

<div class="header">
Student Profile
</div>

<div class="card">

<div class="item">
<b>Name:</b> {{student.name}}
</div>

<div class="item">
<b>Attendance:</b> {{student.attendance}} %
</div>

<div class="item">
<b>DBMS:</b> {{student.dbms}}
</div>

<div class="item">
<b>Python:</b> {{student.python}}
</div>

<div class="item">
<b>AI:</b> {{student.ai}}
</div>

<button class="btn" onclick="toggleEdit()">
Edit Profile
</button>

<form
method="POST"
action="/update_student_profile"
class="edit-form"
id="editForm">

<input
type="hidden"
name="username"
value="{{student.username}}">

<input
type="text"
name="name"
value="{{student.name}}">

<button class="btn" type="submit">
Save Changes
</button>

</form>

</div>

</body>
</html>
